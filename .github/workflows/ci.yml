name: CI

# Pull requests only. A `push: ["**"]` trigger ran a second, identical job for
# every PR branch. Pushes to main stay covered by the deploy workflow, which
# runs `npm test` and `npm run build` (= `tsc -b && vite build`) before
# publishing, so tests and type-checking still gate what ships.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Single source of truth for the Node version — see .nvmrc.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
