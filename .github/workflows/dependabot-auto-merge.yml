name: Dependabot auto-merge

# Dependency bumps should not wait on a human. This queues an auto-merge for them, so they
# land by themselves once CI is green — and only then, because auto-merge waits for the
# required status checks on main (the `test` job).
#
# There is deliberately no approving step. The niceshops-playground org policy forbids
# GitHub Actions from creating or approving pull requests, so `gh pr review --approve`
# answers 409 no matter how the repo itself is configured:
#
#   The organization does not allow GitHub Actions to create or approve pull requests
#
# Instead, main carries no review requirement at all and relies on the required `test`
# check to gate merges. That means this workflow's only job is to press the auto-merge
# button — but it also means the required check is the *only* thing standing between a
# Dependabot pull request and main. Do not remove it from the branch protection without
# removing this workflow too.
#
# `pull_request_target` is deliberate: on a `pull_request` run from Dependabot the
# GITHUB_TOKEN is read-only, so it could not enable auto-merge. This workflow never checks
# out the pull request, so none of its code ever runs here — the step only talks to the
# GitHub API.
on:
  pull_request_target:

permissions:
  actions: write # dispatch the deploy after the merge — see the deploy step below
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Skip bumps GITHUB_TOKEN may not merge
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # GITHUB_TOKEN is a GitHub App token, and an App may only touch
          # .github/workflows/** while holding the `workflows` permission — which a workflow
          # `permissions:` block cannot grant (it is a PAT/App-install scope, not one of the
          # keys Actions accepts). So a bump that edits a workflow file can never be merged
          # from here; `/tidy` merges those with a token that has the scope.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[].filename')
          if grep -q '^\.github/workflows/' <<< "$files"; then
            echo "::notice::#$PR_NUMBER touches .github/workflows/** — GITHUB_TOKEN cannot merge it, left for /tidy"
            echo 'mergeable=false' >> "$GITHUB_OUTPUT"
          else
            echo 'mergeable=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge
        if: steps.gate.outputs.mergeable == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # An auto-merge enabled by GITHUB_TOKEN pushes the squash commit as github-actions[bot],
      # and a GITHUB_TOKEN push fires no events at all — so the deploy workflow's `push`
      # trigger never runs and main sits undeployed until something else lands.
      # `workflow_dispatch` is one of the two events GITHUB_TOKEN may fire, so wait for the
      # merge and dispatch the deploy. `-R` is not optional: with no checkout in this job,
      # `gh` would infer the repository from git and fail with "not a git repository".
      - name: Deploy main once the merge lands
        if: steps.gate.outputs.mergeable == 'true'
        timeout-minutes: 20
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 60); do
            state=$(gh pr view "$PR_URL" --json state --jq .state)
            case "$state" in
              MERGED) gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref main; exit 0 ;;
              CLOSED) echo "PR closed without merging — nothing to deploy"; exit 0 ;;
            esac
            sleep 15
          done
          echo "::error::$PR_URL still not merged after 15 min — deploy not dispatched"
          exit 1
